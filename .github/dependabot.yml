version: 2
updates:
  # Actions are pinned to commit SHAs in the workflows. Dependabot bumps the
  # SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directories:
      - /.github/actions/setup-npm
      - /.github/actions/setup-uv
      - /.github/actions/setup-go
      - /.github/actions/trivy-fs
      - /.github/actions/hadolint
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
