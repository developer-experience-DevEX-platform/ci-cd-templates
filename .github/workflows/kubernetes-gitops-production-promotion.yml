# Kubernetes GitOps Production Promotion
#
# Manual. Promotes a Git SHA that is already running in staging to production
# by writing it into the service's production values file in platform-gitops.
#
#   environments/production/<service>/values.yaml     ->  .image.tag = <git-sha>
#   environments/production/<service>/promotion.yaml  ->  created on first promotion
#
# promotion.yaml is what the production ApplicationSet discovers, so a service
# is not deployed to production until it has been promoted once.
#
# The image is not rebuilt: production runs the same bytes staging tested.
# Promotion is rejected unless staging currently references image_tag.
#
name: Kubernetes GitOps Production Promotion

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable 40-character Git commit SHA already validated in staging.
        required: true
        type: string
      service_name:
        description: Service name. Defaults to the repository name.
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      gitops_repository:
        description: Repository containing GitOps desired state.
        required: false
        type: string
        default: developer-experience-DevEX-platform/platform-gitops
      gitops_branch:
        description: GitOps trunk branch.
        required: false
        type: string
        default: main
    secrets:
      PLATFORM_GITOPS_TOKEN:
        description: Organization token with contents read/write on the GitOps repository. Callers pass it with secrets inherit.
        required: true

permissions:
  contents: read

jobs:
  promote-production-gitops:
    name: Promote production GitOps
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate promotion inputs
        id: promotion
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ ! "$SERVICE_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [[ ${#SERVICE_NAME} -gt 63 ]]; then
            echo "::error::service_name must be lowercase kebab-case with at most 63 characters."
            exit 1
          fi

          if [[ "$IMAGE_TAG" == "latest" ]] || [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::image_tag must be an immutable 40-character Git commit SHA; latest is forbidden."
            exit 1
          fi

          {
            echo "staging_values_file=environments/staging/$SERVICE_NAME/values.yaml"
            echo "production_values_file=environments/production/$SERVICE_NAME/values.yaml"
            echo "production_marker_file=environments/production/$SERVICE_NAME/promotion.yaml"
          } >> "$GITHUB_OUTPUT"

      - name: Check out GitOps trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops_repository }}
          ref: ${{ inputs.gitops_branch }}
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          path: gitops
          persist-credentials: true

      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
        shell: bash
        run: |
          sudo curl --fail --location --silent --show-error \
            "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Promote and push production desired state
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GITOPS_BRANCH: ${{ inputs.gitops_branch }}
          SERVICE_NAME: ${{ inputs.service_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          STAGING_VALUES_FILE: ${{ steps.promotion.outputs.staging_values_file }}
          PRODUCTION_VALUES_FILE: ${{ steps.promotion.outputs.production_values_file }}
          PRODUCTION_MARKER_FILE: ${{ steps.promotion.outputs.production_marker_file }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Several services share this GitOps repository, so a push can lose
          # a race. Re-read trunk and retry rather than failing the promotion.
          for attempt in 1 2 3; do
            echo "GitOps push attempt $attempt of 3."

            git fetch origin "$GITOPS_BRANCH"
            git reset --hard "origin/$GITOPS_BRANCH"

            if [[ ! -f "$STAGING_VALUES_FILE" ]]; then
              echo "::error::Staging values file not found: $STAGING_VALUES_FILE"
              exit 1
            fi

            if [[ ! -f "$PRODUCTION_VALUES_FILE" ]]; then
              echo "::error::Production values file not found: $PRODUCTION_VALUES_FILE"
              exit 1
            fi

            staging_image_tag=$(yq --unwrapScalar '.image.tag' "$STAGING_VALUES_FILE")
            if [[ "$staging_image_tag" != "$IMAGE_TAG" ]]; then
              echo "::error::Production promotion rejected: staging references $staging_image_tag, not $IMAGE_TAG. Promote only what staging is running."
              exit 1
            fi

            export IMAGE_TAG
            yq --inplace '.image.tag = env(IMAGE_TAG)' "$PRODUCTION_VALUES_FILE"
            if [[ ! -f "$PRODUCTION_MARKER_FILE" ]]; then
              printf 'enabled: true\n' > "$PRODUCTION_MARKER_FILE"
            fi
            git add "$PRODUCTION_VALUES_FILE" "$PRODUCTION_MARKER_FILE"

            if git diff --staged --quiet; then
              echo "Production already references image $IMAGE_TAG; no change is required."
              exit 0
            fi

            git commit \
              --message "deploy(production): $SERVICE_NAME to $IMAGE_TAG" \
              --message "Source: $SOURCE_REPOSITORY@$IMAGE_TAG"

            if git push origin "HEAD:$GITOPS_BRANCH"; then
              echo "Production desired state updated successfully."
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 2))
            fi
          done

          echo "::error::Unable to push production desired state after 3 attempts."
          exit 1
