name: Go CI

on:
  workflow_call:
    inputs:
      working_directory:
        description: Service source directory
        required: false
        type: string
        default: .
      has_dockerfile:
        description: Whether the service ships a Dockerfile. Lambda services do not.
        required: false
        type: boolean
        default: true
      dockerfile_path:
        description: Path to the service Dockerfile
        required: false
        type: string
        default: ./Dockerfile
      go_version:
        description: Go version
        required: false
        type: string
        default: "1.25"
      has_integration_tests:
        description: Whether integration tests are implemented
        required: false
        type: boolean
        default: false
      integration_test_vars:
        description: JSON object of non-secret environment variables required by integration tests.
        required: false
        type: string
        default: '{}'
    secrets:
      SONAR_TOKEN:
        description: SonarCloud token from the GitHub organization. Callers pass it with secrets inherit.
        required: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    if: inputs.has_dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < "$DOCKERFILE_PATH"

  static-checks:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: go mod download

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
          verify: false

      - name: Check formatting
        working-directory: ${{ inputs.working_directory }}
        run: make format-check

      - name: Run linting
        # Still report lint results when formatting fails, so both are fixed in one push.
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.working_directory }}
        run: make lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: go mod download

      - name: Run unit tests
        working-directory: ${{ inputs.working_directory }}
        run: make test

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-out
          path: ${{ inputs.working_directory }}/coverage.out
          if-no-files-found: error

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  sast:
    name: SonarQube
    if: github.event_name == 'pull_request'
    needs:
      - static-checks
      - unit-tests
      - dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out
          path: ${{ inputs.working_directory }}

      - name: Provision SonarCloud project
        id: sonar-project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          org="${SONAR_ORGANIZATION:-}"
          if [[ -z "$org" ]]; then
            org="$(printf '%s' "${GITHUB_OWNER}" | tr '[:upper:]' '[:lower:]')"
          fi
          key="$(printf '%s_%s' "${GITHUB_OWNER}" "${GITHUB_REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "organization=${org}" >> "$GITHUB_OUTPUT"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "Using SonarCloud organization ${org} and project key ${key}"

          search="$(curl -sS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/projects/search?organization=${org}&projects=${key}")"
          count="$(printf '%s' "${search}" | jq '.components | length')"
          if [ "${count}" -gt 0 ]; then
            echo "SonarCloud project ${key} already exists in ${org}"
            exit 0
          fi

          http="$(curl -sS -o /tmp/sonar-create.json -w "%{http_code}" \
            -u "${SONAR_TOKEN}:" -X POST \
            "https://sonarcloud.io/api/projects/create" \
            --data-urlencode "organization=${org}" \
            --data-urlencode "project=${key}" \
            --data-urlencode "name=${GITHUB_REPO}")"
          if [ "${http}" = "200" ]; then
            echo "Created SonarCloud project ${key}"
            exit 0
          fi
          echo "Failed to create SonarCloud project ${key} (HTTP ${http})"
          cat /tmp/sonar-create.json
          exit 1

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ inputs.working_directory }}
          args: >-
            -Dsonar.organization=${{ steps.sonar-project.outputs.organization }}
            -Dsonar.projectKey=${{ steps.sonar-project.outputs.key }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.exclusions=**/*_test.go
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out

      - name: Enforce quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  integration-tests:
    name: Integration Tests
    if: github.event_name == 'pull_request' && inputs.has_integration_tests
    needs:
      - sast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: go mod download

      - name: Configure integration test variables
        if: inputs.integration_test_vars != '{}'
        env:
          INTEGRATION_TEST_VARS: ${{ inputs.integration_test_vars }}
        shell: bash
        run: |
          echo "$INTEGRATION_TEST_VARS" |
            jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: ${{ inputs.working_directory }}
        run: make test-integration
