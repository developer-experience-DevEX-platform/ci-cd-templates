name: Node.js Lambda Release

on:
  workflow_call:
    inputs:
      working_directory:
        description: Lambda source directory
        required: false
        type: string
        default: .
    outputs:
      artifact_checksum_base64:
        description: Base64 SHA-256 checksum of the published function.zip
        value: ${{ jobs.publish.outputs.artifact_checksum_base64 }}

permissions:
  contents: read

jobs:
  package:
    name: Package Lambda
    uses: ./.github/workflows/nodejs-lambda-package.yml
    with:
      working_directory: ${{ inputs.working_directory }}
    permissions:
      contents: read

  publish:
    name: Publish Lambda Artifact
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      artifact_checksum_base64: ${{ needs.package.outputs.checksum_base64 }}
    steps:
      - name: Require a push to main
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          # Deliberately a failing step rather than a job-level `if`. A skipped
          # job reports success, so a caller that wires the wrong trigger would
          # see a green check and no release. For packaging validation on pull
          # requests, call nodejs-lambda-package.yml directly from CI.
          if [[ "$EVENT_NAME" != "push" || "$REF" != "refs/heads/main" ]]; then
            echo "::error::Lambda releases run only for a push to main (got $EVENT_NAME on $REF)."
            exit 1
          fi

      - name: Validate platform configuration
        env:
          AWS_LAMBDA_ARTIFACT_BUCKET: ${{ vars.AWS_LAMBDA_ARTIFACT_BUCKET }}
          AWS_LAMBDA_RELEASE_ROLE_ARN: ${{ vars.AWS_LAMBDA_RELEASE_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SERVICE_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail

          for variable_name in AWS_REGION AWS_LAMBDA_RELEASE_ROLE_ARN AWS_LAMBDA_ARTIFACT_BUCKET; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Missing platform-managed repository variable: $variable_name"
              exit 1
            fi
          done

          # The repository name becomes the S3 key prefix, so it has to be a
          # shape S3 and IAM can address predictably.
          if [[ ! "$SERVICE_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Repository name must use lowercase kebab-case to form the service artifact prefix."
            exit 1
          fi

      - name: Download Lambda package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-package-${{ github.sha }}
          path: ${{ runner.temp }}/lambda-release

      - name: Verify downloaded package
        working-directory: ${{ runner.temp }}/lambda-release
        shell: bash
        run: |
          set -euo pipefail

          # Guards transport corruption between the packaging job and this one.
          # sha256sum --check fails if either file is missing, so no separate
          # existence tests are needed.
          sha256sum --check function.zip.sha256

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: devex-lambda-release-${{ github.run_id }}

      - name: Publish immutable Lambda package
        env:
          ARTIFACT_CHECKSUM_BASE64: ${{ needs.package.outputs.checksum_base64 }}
          AWS_LAMBDA_ARTIFACT_BUCKET: ${{ vars.AWS_LAMBDA_ARTIFACT_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PACKAGE_DIRECTORY: ${{ runner.temp }}/lambda-release
          RELEASE_SHA: ${{ github.sha }}
          SERVICE_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail

          object_key="$SERVICE_NAME/$RELEASE_SHA/function.zip"
          error_log="$RUNNER_TEMP/put-object.err"

          # --if-none-match makes S3 refuse to overwrite an existing release,
          # and --checksum-sha256 makes S3 reject a body that does not hash to
          # what packaging measured. Both are enforced server side, so the
          # write-once guarantee does not depend on this script behaving.
          if aws s3api put-object \
            --bucket "$AWS_LAMBDA_ARTIFACT_BUCKET" \
            --key "$object_key" \
            --body "$PACKAGE_DIRECTORY/function.zip" \
            --checksum-sha256 "$ARTIFACT_CHECKSUM_BASE64" \
            --if-none-match '*' \
            --region "$AWS_REGION" \
            --no-cli-pager >/dev/null 2>"$error_log"; then
            echo "Published $object_key"
            exit 0
          fi

          if ! grep -qE 'PreconditionFailed|412' "$error_log"; then
            echo "::error::Failed to publish Lambda release object: $object_key"
            cat "$error_log" >&2
            exit 1
          fi

          # The object already exists. If it holds these exact bytes this is a
          # re-run of an already successful release, which must succeed;
          # otherwise the SHA has been published with different content and the
          # immutability guarantee is broken.
          existing_checksum=$(aws s3api head-object \
            --bucket "$AWS_LAMBDA_ARTIFACT_BUCKET" \
            --key "$object_key" \
            --checksum-mode ENABLED \
            --region "$AWS_REGION" \
            --query 'ChecksumSHA256' \
            --output text \
            --no-cli-pager)

          if [[ "$existing_checksum" != "$ARTIFACT_CHECKSUM_BASE64" ]]; then
            echo "::error::$object_key is already published with a different checksum."
            echo "::error::published=$existing_checksum built=$ARTIFACT_CHECKSUM_BASE64"
            exit 1
          fi

          echo "$object_key already published with identical content; nothing to do."
