# Kubernetes GitOps CD (staging)
#
# Runs after container-release publishes the image. Writes the released Git
# SHA into the service's staging values file in platform-gitops. Argo CD
# syncs from there; this workflow does not talk to the cluster.
#
#   environments/staging/<service>/values.yaml   ->  .image.tag = <git-sha>
#
# The image is never rebuilt between environments and latest is never used.
# Production is a separate, manual promotion.
#
name: Kubernetes GitOps CD

on:
  workflow_call:
    inputs:
      service_name:
        description: Service name. Defaults to the repository name.
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      image_tag:
        description: Immutable 40-character Git commit SHA to deploy. Defaults to github.sha.
        required: false
        type: string
        default: ${{ github.sha }}
      gitops_repository:
        description: Repository containing GitOps desired state.
        required: false
        type: string
        default: developer-experience-DevEX-platform/platform-gitops
      gitops_branch:
        description: GitOps trunk branch.
        required: false
        type: string
        default: main
    secrets:
      PLATFORM_GITOPS_TOKEN:
        description: Organization token with contents read/write on the GitOps repository. Callers pass it with secrets inherit.
        required: true

permissions:
  contents: read

jobs:
  update-staging-gitops:
    name: Update staging GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate deployment inputs
        id: deployment
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ ! "$SERVICE_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [[ ${#SERVICE_NAME} -gt 63 ]]; then
            echo "::error::service_name must be lowercase kebab-case with at most 63 characters."
            exit 1
          fi

          if [[ "$IMAGE_TAG" == "latest" ]] || [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::image_tag must be an immutable 40-character Git commit SHA; latest is forbidden."
            exit 1
          fi

          echo "values_file=environments/staging/$SERVICE_NAME/values.yaml" >> "$GITHUB_OUTPUT"

      - name: Check out GitOps trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops_repository }}
          ref: ${{ inputs.gitops_branch }}
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          path: gitops
          persist-credentials: true

      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
        shell: bash
        run: |
          sudo curl --fail --location --silent --show-error \
            "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update and push staging desired state
        working-directory: gitops
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GITOPS_BRANCH: ${{ inputs.gitops_branch }}
          SERVICE_NAME: ${{ inputs.service_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          VALUES_FILE: ${{ steps.deployment.outputs.values_file }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Several services share this GitOps repository, so a push can lose
          # a race. Re-read trunk and retry rather than failing the deploy.
          for attempt in 1 2 3; do
            echo "GitOps push attempt $attempt of 3."

            # A newer commit on main means a newer release is already on its
            # way to staging. Deploying this older SHA would roll staging back.
            current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
            if [[ "$IMAGE_TAG" != "$current_main_sha" ]]; then
              echo "Staging deployment skipped: $IMAGE_TAG is no longer the current main SHA ($current_main_sha). A newer release supersedes it."
              exit 0
            fi

            git fetch origin "$GITOPS_BRANCH"
            git reset --hard "origin/$GITOPS_BRANCH"

            if [[ ! -f "$VALUES_FILE" ]]; then
              echo "::error::Staging values file not found: $VALUES_FILE. Platform provisioning is incomplete."
              exit 1
            fi

            export IMAGE_TAG
            yq --inplace '.image.tag = env(IMAGE_TAG)' "$VALUES_FILE"
            git add "$VALUES_FILE"

            if git diff --staged --quiet; then
              echo "Staging already references image $IMAGE_TAG; no change is required."
              exit 0
            fi

            git commit \
              --message "deploy(staging): $SERVICE_NAME to $IMAGE_TAG" \
              --message "Source: $SOURCE_REPOSITORY@$IMAGE_TAG"

            if git push origin "HEAD:$GITOPS_BRANCH"; then
              echo "Staging desired state updated successfully."
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 2))
            fi
          done

          echo "::error::Unable to push staging desired state after 3 attempts."
          exit 1
