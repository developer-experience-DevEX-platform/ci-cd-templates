name: Kubernetes GitOps CD

on:
  workflow_call:
    inputs:
      service_name:
        description: Lowercase kebab-case service name.
        required: true
        type: string
      image_tag:
        description: Immutable 40-character Git commit SHA to deploy to staging.
        required: true
        type: string
    secrets:
      PLATFORM_GITOPS_TOKEN:
        description: Fine-grained token scoped to platform-gitops with contents read/write access.
        required: true

permissions:
  contents: read

jobs:
  update-staging-gitops:
    name: Update staging GitOps
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment inputs
        id: deployment
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ ! "$SERVICE_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [[ ${#SERVICE_NAME} -gt 63 ]]; then
            echo "::error::service_name must be lowercase kebab-case with at most 63 characters."
            exit 1
          fi

          if [[ "$IMAGE_TAG" == "latest" ]] || [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::image_tag must be an immutable 40-character Git commit SHA; latest is forbidden."
            exit 1
          fi

          echo "values_file=environments/staging/$SERVICE_NAME/values.yaml" >> "$GITHUB_OUTPUT"

      - name: Check latest application main SHA
        id: latest-main
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')

          if [[ "$IMAGE_TAG" != "$current_main_sha" ]]; then
            echo "Staging deployment superseded: $IMAGE_TAG is not the current main SHA ($current_main_sha)."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out platform GitOps main
        if: steps.latest-main.outputs.superseded == 'false'
        uses: actions/checkout@v4
        with:
          repository: developer-experience-DevEX-platform/platform-gitops
          ref: main
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          path: platform-gitops
          persist-credentials: true

      - name: Install yq
        if: steps.latest-main.outputs.superseded == 'false'
        env:
          YQ_VERSION: v4.53.3
        shell: bash
        run: |
          sudo curl --fail --location --silent --show-error \
            "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update staging image tag
        id: update
        if: steps.latest-main.outputs.superseded == 'false'
        working-directory: platform-gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          VALUES_FILE: ${{ steps.deployment.outputs.values_file }}
        shell: bash
        run: |
          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "::error::Staging values file not found: $VALUES_FILE"
            exit 1
          fi

          export IMAGE_TAG
          yq --inplace '.image.tag = env(IMAGE_TAG)' "$VALUES_FILE"
          git add "$VALUES_FILE"

          if git diff --staged --quiet; then
            echo "Staging already references image $IMAGE_TAG; no change is required."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit staging desired state
        if: steps.update.outputs.changed == 'true'
        working-directory: platform-gitops
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SERVICE_NAME: ${{ inputs.service_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            --message "deploy(staging): $SERVICE_NAME to $IMAGE_TAG" \
            --message "Source: $SOURCE_REPOSITORY@$IMAGE_TAG"

      - name: Rebase and push platform GitOps main
        if: steps.update.outputs.changed == 'true'
        working-directory: platform-gitops
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$IMAGE_TAG" != "$current_main_sha" ]]; then
            echo "Staging deployment superseded before push: $IMAGE_TAG is not current main ($current_main_sha)."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "GitOps push attempt $attempt of 3."
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Staging desired state updated successfully."
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 2))
            fi
          done

          echo "::error::Unable to push staging desired state after 3 attempts."
          exit 1
