name: Kubernetes GitOps CD

on:
  workflow_call:
    inputs:
      service_name:
        description: Service name. Defaults to the repository name.
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      image_tag:
        description: Immutable 40-character Git commit SHA to deploy. Defaults to github.sha.
        required: false
        type: string
        default: ${{ github.sha }}
      gitops_repository:
        description: Repository containing GitOps desired state.
        required: false
        type: string
        default: developer-experience-DevEX-platform/platform-gitops
      gitops_branch:
        description: GitOps trunk branch.
        required: false
        type: string
        default: main
    secrets:
      PLATFORM_GITOPS_TOKEN:
        description: Organization token with contents read/write on the GitOps repository. Callers pass it with secrets inherit.
        required: true

permissions:
  contents: read

jobs:
  update-staging-gitops:
    name: Update staging GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate deployment inputs
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ ! "$SERVICE_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [[ ${#SERVICE_NAME} -gt 63 ]]; then
            echo "::error::service_name must be lowercase kebab-case with at most 63 characters."
            exit 1
          fi

          if [[ "$IMAGE_TAG" == "latest" ]] || [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::image_tag must be an immutable 40-character Git commit SHA; latest is forbidden."
            exit 1
          fi

      - name: Check out GitOps trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops_repository }}
          ref: ${{ inputs.gitops_branch }}
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          path: gitops
          persist-credentials: true

      # A reusable workflow runs against the caller's checkout, so this repo's
      # own scripts are not on disk. The job context points at the commit this
      # workflow was called at, whatever ref the caller pinned.
      - name: Check out CI/CD templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ci-cd-templates
          persist-credentials: false

      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
        shell: bash
        run: |
          sudo curl --fail --location --silent --show-error \
            "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update and push staging desired state
        working-directory: gitops
        env:
          ENVIRONMENT: staging
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GITOPS_BRANCH: ${{ inputs.gitops_branch }}
          SERVICE_NAME: ${{ inputs.service_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: "$GITHUB_WORKSPACE/ci-cd-templates/scripts/gitops-write-desired-state.sh"
