# Container Release
#
#   pull_request:
#     build-image  ->  vulnerability-scan, container-compliance
#
#   push to main:
#     build-image  ->  vulnerability-scan, container-compliance  ->  sbom  ->  publish-ecr
#
# The same image.tar is scanned and (on main) published. The template decides
# when to generate an SBOM and push to ECR; callers do not pass a publish flag.
# image_tag must be a 40-character Git SHA. latest is forbidden.
#
# Call ci.yml only on pull_request. Call release.yml on push to main.
# Platform repository variables for publish:
#   AWS_REGION, AWS_RELEASE_ROLE_ARN, ECR_REPOSITORY
#
name: Container Release

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing the application and Docker build context.
        required: false
        type: string
        default: .
      dockerfile_path:
        description: Dockerfile path relative to working_directory.
        required: false
        type: string
        default: Dockerfile
      image_name:
        description: Local image name used while building. Defaults to the repository name.
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      image_tag:
        description: Immutable 40-character Git commit SHA. Defaults to github.sha.
        required: false
        type: string
        default: ${{ github.sha }}

permissions:
  contents: read

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ "$IMAGE_TAG" == "latest" ]] || [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::image_tag must be an immutable 40-character Git commit SHA; latest is forbidden."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        env:
          BUILD_CONTEXT: ${{ inputs.working_directory }}
          DOCKERFILE: ${{ inputs.working_directory }}/${{ inputs.dockerfile_path }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE_NAME:$IMAGE_TAG" "$BUILD_CONTEXT"

      - name: Save container image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: docker save --output image.tar "$IMAGE_NAME:$IMAGE_TAG"

      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image
          path: image.tar
          retention-days: 1

  vulnerability-scan:
    name: Trivy Vulnerability Scan
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          input: image.tar
          scanners: vuln
          format: json
          output: trivy-image-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          retention-days: 30

  container-compliance:
    name: Container Compliance
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - name: Scan container image with Dockle
        run: >-
          docker run --rm
          --volume "$PWD:/work"
          --workdir /work
          goodwithtech/dockle:v0.4.15
          --input image.tar
          --format json
          --output dockle-report.json
          --exit-code 1
          --exit-level warn

      - name: Upload Dockle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockle-report
          path: dockle-report.json
          retention-days: 30

  sbom:
    name: Generate SBOM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - vulnerability-scan
      - container-compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          input: image.tar
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload container SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom
          path: sbom.cdx.json
          retention-days: 90

  publish-ecr:
    name: Publish to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-image

      - name: Validate platform configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        shell: bash
        run: |
          missing_configuration=false

          for variable_name in AWS_REGION AWS_RELEASE_ROLE_ARN ECR_REPOSITORY; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::Missing platform configuration: $variable_name"
              missing_configuration=true
            fi
          done

          if [[ "$missing_configuration" == "true" ]]; then
            echo "This repository has not been fully provisioned for container releases. Platform configuration is normally created automatically by Backstage."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: devex-container-release-${{ github.run_id }}

      - name: Validate ECR repository
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        shell: bash
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "::error::ECR repository '$ECR_REPOSITORY' was not found in '$AWS_REGION'. Platform provisioning is incomplete."
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Load scanned container image
        run: docker load --input image.tar

      - name: Create ECR image reference
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          echo "SOURCE_IMAGE=$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ECR_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      # If this SHA is already in ECR, fail. Do not overwrite. A re-run
      # after a successful push fails on purpose.
      - name: Verify immutable image tag
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set +e
          describe_result=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" 2>&1)
          describe_status=$?
          set -e

          if [[ $describe_status -eq 0 ]]; then
            echo "::error::Image tag '$IMAGE_TAG' is already in ECR. Release tags are immutable, so this job fails rather than overwriting."
            exit 1
          fi

          if [[ "$describe_result" != *"ImageNotFoundException"* ]]; then
            echo "::error::Unable to verify whether image tag '$IMAGE_TAG' already exists in ECR."
            exit 1
          fi

      - name: Tag container image for ECR
        run: docker tag "$SOURCE_IMAGE" "$ECR_IMAGE"

      - name: Push container image to ECR
        run: docker push "$ECR_IMAGE"

      - name: Write container release summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          {
            echo "# Container Release"
            echo
            echo "**Image:**"
            echo "$ECR_IMAGE"
            echo
            echo "**Image Tag:**"
            echo "$IMAGE_TAG"
            echo
            echo "**Security Gates:**"
            echo "- Trivy: Passed"
            echo "- Dockle: Passed"
            echo "- SBOM: Generated"
          } >> "$GITHUB_STEP_SUMMARY"
