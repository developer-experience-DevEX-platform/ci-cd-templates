name: Python CI

# Job graph
#
#   every push and pull request (parallel):
#     dockerfile-lint  static-checks  unit-tests  dependency-scan
#
#   pull requests only, after the jobs above pass:
#     integration-tests
#   push to main only (temporary, SonarCloud Free):
#     sast (SonarQube)
#
# dockerfile-lint is intentionally not a dependency of sast: it is skipped
# for Lambda services, and a skipped dependency would skip sast as well.
# unit-tests must upload coverage.xml; sast downloads it for the gate.
#
# Contract
#
# The service is a pip project with a requirements.txt and a Makefile with
# these targets:
#   format-check       exits non-zero on formatting drift
#   lint               exits non-zero on lint violations
#   test               runs unit tests and writes coverage.xml
#   test-integration   only when has_integration_tests is true
#
# The workflow runs the targets; the service decides which tools implement
# them.
#
# Integration tests are hermetic: the suite starts its own dependencies
# (Testcontainers, Docker Compose) on the runner. No cloud credentials or
# secrets are provided. Tests against deployed environments belong to CD.

on:
  workflow_call:
    inputs:
      working_directory:
        description: Service source directory
        required: false
        type: string
        default: .
      has_dockerfile:
        description: Whether the service ships a Dockerfile. Lambda services do not.
        required: false
        type: boolean
        default: true
      dockerfile_path:
        description: Path to the service Dockerfile
        required: false
        type: string
        default: ./Dockerfile
      python_version:
        description: Python version
        required: false
        type: string
        default: "3.13"
      has_integration_tests:
        description: Whether integration tests are implemented
        required: false
        type: boolean
        default: false
      integration_test_vars:
        description: JSON object of non-secret environment variables required by integration tests.
        required: false
        type: string
        default: '{}'
    secrets:
      SONAR_TOKEN:
        description: SonarCloud token from the GitHub organization. Callers pass it with secrets inherit.
        required: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    if: inputs.has_dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        env:
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < "$DOCKERFILE_PATH"

  static-checks:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working_directory }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pip install -r requirements.txt

      - name: Check formatting
        working-directory: ${{ inputs.working_directory }}
        run: make format-check

      - name: Run linting
        # Still report lint results when formatting fails, so both are fixed in one push.
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.working_directory }}
        run: make lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working_directory }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: ${{ inputs.working_directory }}
        run: make test

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: ${{ inputs.working_directory }}/coverage.xml
          if-no-files-found: error

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  sast:
    name: SonarQube
    # Temporary: SonarCloud Free analyzes the main branch only. Revert to
    # github.event_name == 'pull_request' after the paid-plan / PR check.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static-checks
      - unit-tests
      - dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml
          path: ${{ inputs.working_directory }}

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ inputs.working_directory }}
          args: >-
            -Dsonar.organization=developer-experience-devex-platform
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Enforce quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  integration-tests:
    name: Integration Tests
    if: github.event_name == 'pull_request' && inputs.has_integration_tests && (needs.sast.result == 'success' || needs.sast.result == 'skipped')
    needs:
      - sast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working_directory }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pip install -r requirements.txt

      - name: Configure integration test variables
        if: inputs.integration_test_vars != '{}'
        env:
          INTEGRATION_TEST_VARS: ${{ inputs.integration_test_vars }}
        shell: bash
        run: |
          echo "$INTEGRATION_TEST_VARS" |
            jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: ${{ inputs.working_directory }}
        run: make test-integration
